<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArcGIS 5.1 + WebGL Water V1.0</title>
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    html,body,arcgis-scene{width:100%;height:100%;margin:0}
    #panel{position:absolute;z-index:20;right:16px;top:16px;width:300px;padding:14px;border-radius:12px;color:white;background:rgba(10,18,28,.88);font:14px Arial,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.35)}
    #panel h2{font-size:17px;margin:0 0 10px}.row{margin-top:10px}.row label{display:flex;justify-content:space-between;font-size:12px}.row input{width:100%}
    button{width:100%;padding:10px;border:0;border-radius:8px;background:#1683e8;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
    #status{margin-top:9px;color:#cfe8ff;min-height:18px}#note{font-size:12px;color:#aec4d6;margin-top:9px;line-height:1.35}
  </style>
</head>
<body>
<arcgis-scene basemap="satellite" ground="world-elevation">
  <arcgis-zoom slot="top-left"></arcgis-zoom><arcgis-navigation-toggle slot="top-left"></arcgis-navigation-toggle><arcgis-compass slot="top-left"></arcgis-compass><arcgis-home slot="top-left"></arcgis-home>
</arcgis-scene>
<div id="panel">
  <h2>WebGL Water V1.0</h2>
  <button id="drop" disabled>Lascia cadere la sfera</button>
  <div id="status">Caricamento…</div>
  <div class="row"><label>Ampiezza impatto <span id="waveV">0.025</span></label><input id="wave" type="range" min="0.010" max="0.060" value="0.025" step="0.0025"></div>
  <div class="row"><label>Densità sfera <span id="densityV">0.35</span></label><input id="density" type="range" min="0.20" max="0.65" value="0.35" step="0.025"></div>
  <div class="row"><label>Smorzamento <span id="dampingV">0.990</span></label><input id="damping" type="range" min="0.985" max="0.995" value="0.990" step="0.0005"></div>
  <div id="note">TODO sistemare sfera</div>
</div>

const [RenderNode,webgl,Point,SpatialReference]=await $arcgis.import([
  "@arcgis/core/views/3d/webgl/RenderNode.js","@arcgis/core/views/3d/webgl.js","@arcgis/core/geometry/Point.js","@arcgis/core/geometry/SpatialReference.js"

const lon=9.18998,lat=45.46417;
const poolHalf=20.0,poolDepthMeters=7.0,poolRimMeters=1.15;
const simSize=256,causticSize=1024;
const scene=document.querySelector("arcgis-scene"),dropBtn=document.getElementById("drop"),statusEl=document.getElementById("status");
const waveInput=document.getElementById("wave"),densityInput=document.getElementById("density"),dampingInput=document.getElementById("damping");
for(const [i,o] of [[waveInput,waveV],[densityInput,densityV],[dampingInput,dampingV]])i.addEventListener("input",()=>o.textContent=i.value);
await scene.viewOnReady(); const view=scene.view; await view.when();
const gp=new Point({longitude:lon,latitude:lat,spatialReference:SpatialReference.WGS84});
const er=await view.map.ground.queryElevation(gp); const groundZ=er.geometry.z; const waterZ=groundZ+poolDepthMeters+0.4;
await view.goTo({
  target:new Point({longitude:lon,latitude:lat,z:waterZ,spatialReference:SpatialReference.WGS84}),
  scale:900,
  tilt:72,
  heading:0
},{animate:false});

initCopy(){const gl=this.gl;this.fullVao=gl.createVertexArray();this.copyP=program(gl,quadVS,`#version 300 es\nprecision highp float;uniform sampler2D src;in vec2 uv;out vec4 c;void main(){c=vec4(texture(src,uv).rgb,1.0);}`);this.copyU=gl.getUniformLocation(this.copyP,"src")},
